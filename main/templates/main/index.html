{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Love Story | Forever & Always</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Outfit:wght@300;400;600;700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="{% static 'main/style.css' %}" />
  
  <!-- Custom React & Interactive Styling -->
  <style>
    :root {
      --primary: #ff007f;
      --primary-light: #ff4d94;
      --primary-dark: #cc0066;
      --bg-color: #050505;
      --text-main: #ffffff;
      --glass: rgba(15, 15, 15, 0.8);
      --glass-border: rgba(255, 0, 127, 0.25);
    }

    body {
      background-color: var(--bg-color) !important;
      color: var(--text-main) !important;
      background-image: 
        linear-gradient(rgba(255, 0, 127, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 127, 0.04) 1px, transparent 1px) !important;
      background-size: 50px 50px !important;
      overflow-x: hidden;
    }

    /* Starry Sky / Particles Container */
    #hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Glassmorphism panel */
    .glass-panel {
      background: var(--glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(255, 0, 127, 0.15);
    }

    /* Live Counter */
    .counter-number {
      font-size: 4.5rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 35px var(--primary);
      line-height: 1;
      font-family: 'Outfit', sans-serif;
    }

    .counter-unit {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--primary);
      font-weight: 700;
      margin-top: 5px;
    }

    /* Interactive Timeline Cards */
    .timeline-card {
      background: rgba(15, 15, 15, 0.6) !important;
      border: 1.5px solid var(--glass-border) !important;
      border-radius: 20px;
      padding: 2rem;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .timeline-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .timeline-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--primary) !important;
      box-shadow: 0 10px 30px rgba(255, 0, 127, 0.25) !important;
    }

    .timeline-card:hover::before {
      opacity: 1;
    }

    .timeline-card.active {
      border-color: var(--primary) !important;
      background: rgba(255, 0, 127, 0.05) !important;
      box-shadow: 0 0 35px rgba(255, 0, 127, 0.35) !important;
    }

    /* Bouncing Equalizer visualizer */
    .equalizer-bar-container {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 20px;
      width: 30px;
    }

    .equalizer-bar {
      width: 3px;
      height: 3px;
      background-color: var(--primary);
      border-radius: 3px;
      transition: height 0.15s ease;
    }

    .equalizer-bar-container.active .equalizer-bar:nth-child(1) { animation: bounceBar 0.8s infinite alternate 0.1s; }
    .equalizer-bar-container.active .equalizer-bar:nth-child(2) { animation: bounceBar 0.8s infinite alternate 0.3s; }
    .equalizer-bar-container.active .equalizer-bar:nth-child(3) { animation: bounceBar 0.8s infinite alternate 0.2s; }
    .equalizer-bar-container.active .equalizer-bar:nth-child(4) { animation: bounceBar 0.8s infinite alternate 0.4s; }

    @keyframes bounceBar {
      0% { height: 3px; }
      100% { height: 20px; }
    }

    /* Romantic wishes card widget */
    .wish-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      transition: all 0.4s ease;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .wish-text {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      color: var(--primary-light);
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
      line-height: 1.4;
      margin-bottom: 20px;
    }

    /* 3D Tilt Preview Card */
    .tilt-card-container {
      perspective: 1000px;
      width: 100%;
    }

    .tilt-card {
      transition: transform 0.15s ease-out;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .tilt-card-inner {
      transform: translateZ(30px);
    }

    /* Floating music widget */
    .music-widget-floating {
      position: fixed;
      bottom: 30px;
      left: 30px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 10px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .music-widget-floating:hover {
      transform: scale(1.05) translateY(-3px);
      box-shadow: 0 10px 25px rgba(255, 0, 127, 0.3);
    }
  </style>
</head>

<body>
  <!-- Container for CSS falling hearts -->
  <div id="hearts-container"></div>

  <!-- User authentication data for React -->
  <div id="user-data" 
       data-is-authenticated="{{ user.is_authenticated|yesno:'true,false' }}"
       data-username="{{ user.username }}"
       data-logout-url="{% url 'logout' %}"
       data-login-url="{% url 'login' %}"
       data-home-url="{% url 'home' %}"
       data-gallery-url="{% url 'gallery' %}"
       data-she-url="{% url 'she' %}"
       data-love-3d-url="{% url 'love_3d' %}"
       data-csrf-token="{{ csrf_token }}"></div>

  <!-- React root mount point -->
  <div id="app-root"></div>

  <!-- Background Music Audio -->
  <audio id="romantic-bgm" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <!-- React, ReactDOM, Babel, Swiper, GSAP -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="https://unpkg.co/gsap@3/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>

  <!-- React Application Core -->
  <script type="text/babel">
    {% verbatim %}
    const { useState, useEffect, useRef } = React;

    const userDataEl = document.getElementById('user-data');
    const userState = {
      isAuthenticated: userDataEl.getAttribute('data-is-authenticated') === 'true',
      username: userDataEl.getAttribute('data-username'),
      logoutUrl: userDataEl.getAttribute('data-logout-url'),
      loginUrl: userDataEl.getAttribute('data-login-url'),
      homeUrl: userDataEl.getAttribute('data-home-url'),
      galleryUrl: userDataEl.getAttribute('data-gallery-url'),
      sheUrl: userDataEl.getAttribute('data-she-url'),
      love3dUrl: userDataEl.getAttribute('data-love-3d-url'),
      csrfToken: userDataEl.getAttribute('data-csrf-token')
    };

    const LOVE_MEMORIES = [
      {
        id: 1,
        date: "August 14, 2023",
        title: "The Day We First Met",
        desc: "A simple glance that changed my world forever. The day my soul recognized yours.",
        icon: "✨",
        story: "It was a warm afternoon when our eyes met. The crowded room suddenly grew quiet, and in that split second, I knew my life would never be the same. That initial smile of yours remains etched in my heart."
      },
      {
        id: 2,
        date: "Aug 2023 - Feb 2025",
        title: "Beautiful Friendship",
        desc: "A chapter of shared secrets, endless laughter, and a bond that grew stronger every day.",
        icon: "☕",
        story: "We built our bond cup by cup, laugh by laugh. We shared dreams, supported each other through late-night study sessions, and talked about everything under the sun. You became my safe space."
      },
      {
        id: 3,
        date: "February 24, 2025",
        title: "The Big Proposal",
        desc: "With a heart full of hope, I asked you to be my forever. The day I promised to love you always.",
        icon: "💍",
        story: "My heart was pounding, my hands slightly shaking as I looked into your eyes and asked you to stand by me for the rest of our lives. It was a promise of a lifetime, wrapped in hope."
      },
      {
        id: 4,
        date: "August 24, 2025",
        title: "She Accepted! ❤️",
        desc: "The most beautiful 'Yes' I've ever heard. Our story officially entered its greatest chapter.",
        icon: "💝",
        story: "The moment you officially agreed to be mine. It marked the start of our countdown of pure, endless love. From that day on, it has been 'us' against the world."
      }
    ];

    const ROMANTIC_WISHES = [
      "You are the peace in my chaos, the light in my dark, and the love of my life. ❤️",
      "I love you not only for what you are, but for what I am when I am with you.",
      "In a room full of art, I'd still stare at you. ✨",
      "You are my today, and all of my tomorrows. 🌸",
      "If I had a flower for every time I thought of you... I could walk through my garden forever.",
      "Every love story is beautiful, but ours is my favorite. 💖",
      "Your smile is my favorite view, and your voice is my favorite sound.",
      "Holding your hand is like holding a dream. Never let go."
    ];

    const GALLERY_IMAGES = [
      "{% endverbatim %}{% static 'main/gallery/gallery1.png' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery2.png' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery3.jpg' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery4.jpg' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery5.jpg' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery6.jpg' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery7.jpg' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery8.jpg' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery9.png' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery10.jpg' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery11.png' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery12.jpg' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery13.jpg' %}{% verbatim %}",
      "{% endverbatim %}{% static 'main/gallery/gallery14.jpg' %}{% verbatim %}"
    ];

    function App() {
      const [daysLeft, setDaysLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
      const [isPlayingMusic, setIsPlayingMusic] = useState(false);
      const [activeMemory, setActiveMemory] = useState(LOVE_MEMORIES[3]);
      const [currentWish, setCurrentWish] = useState(ROMANTIC_WISHES[0]);
      const [wishFade, setWishFade] = useState(false);
      const [tiltStyle, setTiltStyle] = useState({});

      // Love Spark Calculator States
      const [calcNames, setCalcNames] = useState({ name1: 'Ashik', name2: 'Anu' });
      const [calcResult, setCalcResult] = useState(null);
      const [calcLoading, setCalcLoading] = useState(false);
      const [calcProgress, setCalcProgress] = useState(0);

      // Relationship Counter Effect (Real-time updates)
      useEffect(() => {
        const startDate = new Date('2025-08-24T00:00:00');
        
        const updateTimer = () => {
          const now = new Date();
          const difference = now - startDate;

          if (difference > 0) {
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((difference / 1000 / 60) % 60);
            const seconds = Math.floor((difference / 1000) % 60);
            setDaysLeft({ days, hours, minutes, seconds });
          }
        };

        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, []);

      // Background floating hearts animation
      useEffect(() => {
        const container = document.getElementById('hearts-container');
        if (!container) return;

        const generateHeart = () => {
          const heart = document.createElement('div');
          heart.innerHTML = Math.random() > 0.5 ? '❤️' : '💖';
          heart.style.position = 'absolute';
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.top = '100vh';
          heart.style.fontSize = (Math.random() * 18 + 10) + 'px';
          heart.style.opacity = Math.random() * 0.4 + 0.1;
          heart.style.color = '#ff007f';
          heart.style.userSelect = 'none';
          heart.style.pointerEvents = 'none';
          
          container.appendChild(heart);
          
          const duration = Math.random() * 6 + 6;
          gsap.to(heart, {
            y: -window.innerHeight - 200,
            x: (Math.random() - 0.5) * 150,
            rotation: Math.random() * 360,
            duration: duration,
            ease: "none",
            onComplete: () => heart.remove()
          });
        };

        const heartTimer = setInterval(generateHeart, 1000);
        return () => clearInterval(heartTimer);
      }, []);

      // GSAP Scroll Animation setup
      useEffect(() => {
        gsap.registerPlugin(ScrollTrigger);
        
        // Animating cards & titles on scroll
        gsap.from(".scroll-animate-title", {
          scrollTrigger: {
            trigger: ".scroll-animate-title",
            start: "top 80%"
          },
          y: 30,
          opacity: 0,
          duration: 1
        });

        gsap.from(".story-grid-react", {
          scrollTrigger: {
            trigger: ".story-grid-react",
            start: "top 85%"
          },
          opacity: 0,
          y: 50,
          duration: 1.2
        });

        // Initialize Swiper
        const swiper = new Swiper('.moments-swiper', {
          slidesPerView: 'auto',
          spaceBetween: 30,
          centeredSlides: true,
          loop: true,
          autoplay: {
            delay: 3500,
            disableOnInteraction: false,
          },
          pagination: {
            el: '.swiper-pagination',
            clickable: true,
          },
          navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
          },
        });
      }, []);

      // Toggle background BGM
      const handleToggleMusic = () => {
        const audio = document.getElementById('romantic-bgm');
        if (isPlayingMusic) {
          audio.pause();
        } else {
          audio.play().catch(e => console.log("Music blocked: " + e));
        }
        setIsPlayingMusic(!isPlayingMusic);
      };

      // Draw random wish note
      const handleNextWish = () => {
        setWishFade(true);
        setTimeout(() => {
          let newWish = currentWish;
          while (newWish === currentWish) {
            const index = Math.floor(Math.random() * ROMANTIC_WISHES.length);
            newWish = ROMANTIC_WISHES[index];
          }
          setCurrentWish(newWish);
          setWishFade(false);
          
          // Trigger heart burst from the button
          const btn = document.getElementById('wish-btn');
          const rect = btn.getBoundingClientRect();
          for(let i=0; i<6; i++) {
            const star = document.createElement('div');
            star.innerHTML = '❤️';
            star.style.position = 'fixed';
            star.style.left = (rect.left + rect.width/2) + 'px';
            star.style.top = rect.top + 'px';
            star.style.zIndex = 1000;
            star.style.pointerEvents = 'none';
            document.body.appendChild(star);
            
            gsap.to(star, {
              y: rect.top - 100 - Math.random()*100,
              x: (rect.left + rect.width/2) + (Math.random() - 0.5)*160,
              opacity: 0,
              scale: 1.5,
              duration: 1.2,
              onComplete: () => star.remove()
            });
          }
        }, 300);
      };

      // Mouse cursor heart trail effect
      useEffect(() => {
        const handleMouseMove = (e) => {
          if (Math.random() > 0.15) return; // limit spawn rate
          
          const heart = document.createElement('div');
          heart.innerHTML = Math.random() > 0.5 ? '❤️' : '💖';
          heart.style.position = 'fixed';
          heart.style.left = e.clientX + 'px';
          heart.style.top = e.clientY + 'px';
          heart.style.fontSize = (Math.random() * 12 + 6) + 'px';
          heart.style.pointerEvents = 'none';
          heart.style.zIndex = '9999';
          heart.style.color = '#ff007f';
          heart.style.textShadow = '0 0 5px #ff007f';
          heart.style.opacity = '0.8';
          document.body.appendChild(heart);

          gsap.to(heart, {
            y: e.clientY + (Math.random() - 0.5) * 60 - 60,
            x: e.clientX + (Math.random() - 0.5) * 60,
            scale: 0.1,
            opacity: 0,
            duration: 1.0,
            ease: "power1.out",
            onComplete: () => heart.remove()
          });
        };

        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      // Calculate love compatibility score
      const handleCalculateLove = (e) => {
        e.preventDefault();
        if (!calcNames.name1 || !calcNames.name2) return;
        
        setCalcLoading(true);
        setCalcProgress(0);
        setCalcResult(null);
        
        let currentP = 0;
        const interval = setInterval(() => {
          currentP += 5;
          setCalcProgress(currentP);
          if (currentP >= 100) {
            clearInterval(interval);
            
            const n1 = calcNames.name1.toLowerCase().trim();
            const n2 = calcNames.name2.toLowerCase().trim();
            
            let score = 95 + Math.floor(Math.random() * 5); // Default high romance range
            let message = "A perfect cosmic connection! Your paths were written in the stars.";
            
            if ((n1.includes('ashik') && n2.includes('anu')) || (n1.includes('anu') && n2.includes('ashik'))) {
              score = 100;
              message = "100% Eternal Soulmates! Ashik ❤️ Anu. Your love is destined to stand the test of time and space.";
            }
            
            setCalcResult({ score, message });
            setCalcLoading(false);
            
            // Spawn a giant burst of hearts
            for (let i = 0; i < 30; i++) {
              const heart = document.createElement('div');
              heart.innerHTML = i % 2 === 0 ? '❤️' : '💖';
              heart.style.position = 'fixed';
              heart.style.left = Math.random() * 100 + 'vw';
              heart.style.bottom = '-50px';
              heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
              heart.style.zIndex = '9999';
              heart.style.pointerEvents = 'none';
              document.body.appendChild(heart);
              
              gsap.to(heart, {
                y: -window.innerHeight - 100,
                x: `+=${(Math.random() - 0.5) * 300}`,
                rotation: Math.random() * 360,
                duration: Math.random() * 3 + 2,
                ease: "power1.out",
                onComplete: () => heart.remove()
              });
            }
          }
        }, 80);
      };

      // Mouse move 3D tilt effect
      const handleMouseMove = (e) => {
        const card = e.currentTarget;
        const box = card.getBoundingClientRect();
        const x = e.clientX - box.left - box.width / 2;
        const y = e.clientY - box.top - box.height / 2;
        
        const tiltX = -(y / (box.height / 2)) * 12;
        const tiltY = (x / (box.width / 2)) * 12;
        
        setTiltStyle({
          transform: `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`
        });
      };

      const handleMouseLeave = () => {
        setTiltStyle({
          transform: 'rotateX(0deg) rotateY(0deg)'
        });
      };

      return (
        <React.Fragment>
          {/* Navbar */}
          <nav className="navbar">
            <a href={userState.homeUrl} className="logo">A&A</a>
            <ul className="nav-links">
              <li><a href="#home">Home</a></li>
              <li><a href="#story">Our Story</a></li>
              <li><a href={userState.galleryUrl}>Gallery</a></li>
              <li><a href={userState.sheUrl}>Anu ❤️</a></li>
              <li><a href={userState.love3dUrl} style={{ color: 'var(--primary)', fontWeight: '700' }}>3D World ✨</a></li>
            </ul>
          </nav>

          {/* Hero Section */}
          <header id="home" className="hero">
            <div className="hero-content">
              <h1 className="hero-title">
                Every Love Story is Beautiful, but ours is my <span className="highlight">favorite</span>.
              </h1>
              <p className="hero-subtitle">Dedicated to the one who makes my heart skip a beat.</p>
              
              <div style={{ display: 'flex', gap: '15px', marginTop: '25px', flexWrap: 'wrap' }}>
                <a href={userState.love3dUrl} className="cta-button" style={{ background: 'linear-gradient(45deg, #ff007f, #ff5e62)', boxShadow: '0 0 25px rgba(255, 0, 127, 0.5)', display: 'inline-flex', alignItems: 'center', gap: '8px' }}>
                  <i className="fa-solid fa-cube"></i> Explore 3D World ✨
                </a>
                <a href={userState.galleryUrl} className="cta-button">Browse Photos</a>
                <a href={userState.sheUrl} className="cta-button" style={{ background: 'transparent', color: 'var(--primary)', border: '2px solid var(--primary)', boxShadow: '0 0 15px rgba(255, 0, 127, 0.15)' }}>
                  ANU ❤️
                </a>
              </div>
            </div>

            {/* Right Side: Interactive 3D Parallax Tilt Love Counter */}
            <div className="tilt-card-container">
              <div 
                className="tilt-card glass-panel" 
                style={{ ...tiltStyle, padding: '3.5rem', textAlign: 'center', maxWidth: '500px', margin: '0 auto' }}
                onMouseMove={handleMouseMove}
                onMouseLeave={handleMouseLeave}
              >
                <div className="tilt-card-inner">
                  <div style={{ fontFamily: 'Dancing Script, cursive', fontSize: '2.4rem', color: 'var(--primary)', marginBottom: '5px' }}>
                    Our Journey Started
                  </div>
                  <div style={{ fontSize: '1.1rem', color: '#fff', opacity: '0.7', marginBottom: '25px', letterSpacing: '1px' }}>
                    August 24, 2025
                  </div>
                  
                  {/* Live Counter Grid */}
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '20px', marginBottom: '30px' }}>
                    <div style={{ background: 'rgba(255, 255, 255, 0.02)', padding: '15px', borderRadius: '15px', border: '1px solid rgba(255,0,127,0.1)' }}>
                      <div className="counter-number">{daysLeft.days}</div>
                      <div className="counter-unit">Days</div>
                    </div>
                    <div style={{ background: 'rgba(255, 255, 255, 0.02)', padding: '15px', borderRadius: '15px', border: '1px solid rgba(255,0,127,0.1)' }}>
                      <div className="counter-number">{String(daysLeft.hours).padStart(2, '0')}</div>
                      <div className="counter-unit">Hours</div>
                    </div>
                    <div style={{ background: 'rgba(255, 255, 255, 0.02)', padding: '15px', borderRadius: '15px', border: '1px solid rgba(255,0,127,0.1)' }}>
                      <div className="counter-number">{String(daysLeft.minutes).padStart(2, '0')}</div>
                      <div className="counter-unit">Mins</div>
                    </div>
                    <div style={{ background: 'rgba(255, 255, 255, 0.02)', padding: '15px', borderRadius: '15px', border: '1px solid rgba(255,0,127,0.1)' }}>
                      <div className="counter-number" style={{ color: 'var(--primary-light)' }}>{String(daysLeft.seconds).padStart(2, '0')}</div>
                      <div className="counter-unit">Secs</div>
                    </div>
                  </div>

                  <div style={{ fontSize: '1rem', color: '#fff', background: 'rgba(255, 0, 127, 0.15)', padding: '8px 20px', borderRadius: '50px', border: '1.5px solid var(--primary)', display: 'inline-block', boxShadow: '0 0 10px rgba(255,0,127,0.2)' }}>
                    Today: {new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                  </div>
                </div>
              </div>
            </div>
          </header>

          {/* Floating BGM visualizer controller */}
          <div className="music-widget-floating glass-panel" onClick={handleToggleMusic}>
            <div className={`equalizer-bar-container ${isPlayingMusic ? 'active' : ''}`}>
              <div className="equalizer-bar"></div>
              <div className="equalizer-bar"></div>
              <div className="equalizer-bar"></div>
              <div className="equalizer-bar"></div>
            </div>
            <span style={{ fontSize: '0.9rem', fontWeight: '700', color: isPlayingMusic ? 'var(--primary)' : '#fff' }}>
              {isPlayingMusic ? 'Now Playing' : 'Play Love Song'}
            </span>
          </div>

          {/* Story Section */}
          <section id="story" className="section story-section">
            <div className="section-container">
              <h2 className="section-title scroll-animate-title">Our Romantic Odyssey</h2>
              
              <div className="story-grid-react" style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: '50px', alignItems: 'center' }}>
                
                {/* Timeline interactive list */}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  {LOVE_MEMORIES.map((memory) => (
                    <div 
                      key={memory.id} 
                      className={`timeline-card ${activeMemory.id === memory.id ? 'active' : ''}`}
                      onClick={() => setActiveMemory(memory)}
                    >
                      <div style={{ display: 'flex', alignItems: 'center', gap: '15px' }}>
                        <span style={{ fontSize: '2rem' }}>{memory.icon}</span>
                        <div>
                          <span className="date" style={{ color: 'var(--primary)', fontWeight: '700', fontSize: '0.9rem' }}>{memory.date}</span>
                          <h3 style={{ fontSize: '1.3rem', margin: '2px 0 5px 0' }}>{memory.title}</h3>
                          <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem' }}>{memory.desc}</p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Highlight Memory Card detail */}
                <div className="glass-panel" style={{ padding: '3rem', position: 'relative', height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                  <div style={{ position: 'absolute', top: '20px', right: '30px', fontSize: '5rem', opacity: '0.05', color: 'var(--primary)' }}>
                    <i className="fa-solid fa-heart"></i>
                  </div>
                  <span style={{ color: 'var(--primary)', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '2px', fontSize: '0.85rem' }}>Memory Spotlight</span>
                  <h3 style={{ fontSize: '2.2rem', fontFamily: 'Dancing Script, cursive', color: 'var(--primary-light)', margin: '10px 0 20px 0' }}>
                    {activeMemory.title}
                  </h3>
                  <p style={{ fontSize: '1.15rem', lineHeight: '1.8', color: '#dddddd', fontStyle: 'italic' }}>
                    "{activeMemory.story}"
                  </p>
                </div>

              </div>
            </div>
          </section>

          {/* Captured Moments Slideshow */}
          <section id="moments" className="section moments-section">
            <div className="section-container">
              <h2 className="section-title">Captured Moments</h2>

              <div className="swiper moments-swiper">
                <div className="swiper-wrapper">
                  {GALLERY_IMAGES.map((imgUrl, idx) => (
                    <div key={idx} className="swiper-slide moment-slide">
                      <img src={imgUrl} className="slideshow-img" />
                    </div>
                  ))}
                </div>
                
                <div className="swiper-pagination"></div>
                <div className="swiper-button-next"></div>
                <div className="swiper-button-prev"></div>
              </div>

              <div className="center-btn">
                <a href={userState.galleryUrl} className="btn-outline">Immerse in Our Journey 💖</a>
              </div>
            </div>
          </section>

          {/* Wishes & Love Calculator Sections */}
          <section id="wishes" className="section" style={{ background: '#070707' }}>
            <div className="section-container">
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: '40px', alignItems: 'start' }}>
                
                {/* Column 1: Love Notes */}
                <div>
                  <h2 className="section-title" style={{ fontSize: '3rem', marginBottom: '30px', textAlign: 'left' }}>Love Notes</h2>
                  <div className="wish-box glass-panel" style={{ minHeight: '260px' }}>
                    <div className="quote-icon" style={{ fontSize: '3.5rem', marginBottom: '10px' }}>"</div>
                    <div className={`wish-text ${wishFade ? 'fade' : ''}`} style={{ transition: 'opacity 0.3s', opacity: wishFade ? 0 : 1 }}>
                      {currentWish}
                    </div>
                    <button 
                      id="wish-btn"
                      className="cta-button" 
                      onClick={handleNextWish} 
                      style={{ padding: '0.8rem 2rem', fontSize: '0.9rem', background: 'linear-gradient(45deg, #ff007f, #ff758f)' }}
                    >
                      Draw Another Note 💖
                    </button>
                  </div>
                </div>

                {/* Column 2: Love Spark Calculator */}
                <div>
                  <h2 className="section-title" style={{ fontSize: '3rem', marginBottom: '30px', textAlign: 'left' }}>Spark Calculator</h2>
                  <div className="glass-panel" style={{ padding: '30px', minHeight: '260px' }}>
                    {!calcResult && !calcLoading && (
                      <form onSubmit={handleCalculateLove} style={{ display: 'flex', flexDirection: 'column', gap: '15px' }}>
                        <div style={{ display: 'flex', gap: '10px' }}>
                          <div style={{ flex: 1 }}>
                            <label style={{ fontSize: '0.85rem', color: 'var(--primary)', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '1px', display: 'block', marginBottom: '5px' }}>Your Name</label>
                            <input 
                              type="text" 
                              value={calcNames.name1} 
                              onChange={(e) => setCalcNames({ ...calcNames, name1: e.target.value })}
                              style={{ width: '100%', padding: '12px', background: 'rgba(255, 255, 255, 0.05)', border: '1px solid var(--glass-border)', borderRadius: '10px', color: 'white', fontSize: '1rem' }} 
                            />
                          </div>
                          <div style={{ flex: 1 }}>
                            <label style={{ fontSize: '0.85rem', color: 'var(--primary)', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '1px', display: 'block', marginBottom: '5px' }}>Her Name</label>
                            <input 
                              type="text" 
                              value={calcNames.name2} 
                              onChange={(e) => setCalcNames({ ...calcNames, name2: e.target.value })}
                              style={{ width: '100%', padding: '12px', background: 'rgba(255, 255, 255, 0.05)', border: '1px solid var(--glass-border)', borderRadius: '10px', color: 'white', fontSize: '1rem' }} 
                            />
                          </div>
                        </div>
                        <button type="submit" className="cta-button" style={{ width: '100%', padding: '12px', marginTop: '10px', background: 'linear-gradient(45deg, #ff007f, #ff5e62)', border: 'none', fontWeight: '700' }}>
                          Calculate Compatibility ❤️
                        </button>
                      </form>
                    )}

                    {calcLoading && (
                      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '200px', gap: '15px' }}>
                        <div style={{ fontSize: '3rem', color: 'var(--primary)', animation: 'heartbeat 1s infinite' }}>❤️</div>
                        <div style={{ fontSize: '1.2rem', fontWeight: '600' }}>Connecting Souls... {calcProgress}%</div>
                        <div style={{ width: '100%', height: '6px', background: 'rgba(255,255,255,0.05)', borderRadius: '10px', overflow: 'hidden' }}>
                          <div style={{ width: `${calcProgress}%`, height: '100%', background: 'var(--primary)', transition: 'width 0.1s' }}></div>
                        </div>
                      </div>
                    )}

                    {calcResult && (
                      <div style={{ textAlign: 'center' }}>
                        <div style={{ fontSize: '1rem', textTransform: 'uppercase', color: 'var(--primary)', fontWeight: '700', letterSpacing: '2px' }}>Compatibility Score</div>
                        <div style={{ fontSize: '4rem', fontWeight: '800', margin: '5px 0 15px 0', textShadow: '0 0 20px var(--primary)', color: 'white' }}>{calcResult.score}%</div>
                        <p style={{ fontSize: '1.1rem', color: '#eee', fontStyle: 'italic', marginBottom: '20px', lineHeight: '1.6' }}>"{calcResult.message}"</p>
                        <button 
                          className="btn-outline" 
                          onClick={() => setCalcResult(null)} 
                          style={{ padding: '8px 20px', fontSize: '0.85rem' }}
                        >
                          Try Again 💫
                        </button>
                      </div>
                    )}
                  </div>
                </div>

              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="footer">
            <p style={{ letterSpacing: '1px', opacity: 0.8 }}>Made with ❤️ for Anu & Ashik</p>
            <div className="scroll-top" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>↑</div>
          </footer>
        </React.Fragment>
      );
    }

    const container = document.getElementById('app-root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
    {% endverbatim %}
  </script>
</body>

</html>
